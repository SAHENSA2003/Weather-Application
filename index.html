<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/custom.css">
    <link rel="stylesheet" href="./CSS/Responsive.css">
</head>

<body>
    <div class="sky"></div>

    <main class="stage">
        <div class="eyebrow-mark">
            <svg viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
                    stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                <circle cx="12" cy="12" r="4.2" fill="#fff" />
            </svg>
            <span>Weather</span>
        </div>

        <h1>Search location</h1>
        <div class="inputfield">
            <input id="locationInput" type="text" name="location" placeholder="City or town" required>
            <button class="go" type="submit">Check</button>
        </div>
         
        <section id="resultCard" class="result">
            <div class="result-inner">
              
            </div>
        </section>
    </main>
    <script src="./main.js"></script>
</body>

</html>
